<!-- columns -->
<rect x="820" y="176" width="220" height="424" class="box"/>
<text x="838" y="204" class="label">REFERENCES / 23</text>
<text x="838" y="222" class="m">loaded on demand</text>
<g class="ts">
  <rect x="838" y="240" width="184" height="26" class="chip"/><text x="848" y="257">00 Doctrine</text>
  <rect x="838" y="274" width="184" height="26" class="chip"/><text x="848" y="291">01–02 Intake · Concept</text>
  <rect x="838" y="308" width="184" height="26" class="chip"/><text x="848" y="325">03–06 Direction · Type</text>
  <rect x="838" y="342" width="184" height="26" class="chip"/><text x="848" y="359">07–11 Motion · WebGL</text>
  <rect x="838" y="376" width="184" height="26" class="chip"/><text x="848" y="393">12–13 Access · Perf</text>
  <rect x="838" y="410" width="184" height="26" class="chip"/><text x="848" y="427">14–15 Figma · Playwright</text>
  <rect x="838" y="444" width="184" height="26" class="chip"/><text x="848" y="461">16 Review circuit</text>
  <rect x="838" y="478" width="184" height="26" class="chip"/><text x="848" y="495">17–18 Slop · Copy</text>
  <rect x="838" y="512" width="184" height="26" class="chip"/><text x="848" y="529">19–22 Stack · Install</text>
</g>
<text x="838" y="566" class="m" fill="#6F6A63">one file per domain</text>

<rect x="1060" y="176" width="220" height="424" class="box"/>
<text x="1078" y="204" class="label">SCRIPTS / 7</text>
<text x="1078" y="222" class="m">opinion → evidence</text>
<g class="ts">
  <text x="1078" y="252" class="mono" fill="#FF4A1C">audit.mjs</text>
  <text x="1078" y="268" class="m">source → findings + score</text>
  <text x="1078" y="294" class="mono" fill="#FF4A1C">visual-audit.mjs</text>
  <text x="1078" y="310" class="m">URL → screenshots + JSON</text>
  <text x="1078" y="336" class="mono" fill="#FF4A1C">review.mjs</text>
  <text x="1078" y="352" class="m">scores → state + scorecard</text>
  <text x="1078" y="378" class="mono" fill="#FF4A1C">tokens.mjs</text>
  <text x="1078" y="394" class="m">JSON → CSS + contrast</text>
  <text x="1078" y="420" class="mono" fill="#FF4A1C">figma-sync.mjs</text>
  <text x="1078" y="436" class="m">variables → DTCG</text>
  <text x="1078" y="462" class="mono" fill="#FF4A1C">doctor.mjs</text>
  <text x="1078" y="478" class="m">environment → report</text>
  <text x="1078" y="504" class="mono" fill="#FF4A1C">new-project.mjs</text>
  <text x="1078" y="520" class="m">template → project</text>
</g>
<text x="1078" y="566" class="m" fill="#6F6A63">plain Node · no telemetry</text>

<rect x="1300" y="176" width="236" height="424" class="box"/>
<text x="1318" y="204" class="label">ASSETS / MATERIAL</text>
<text x="1318" y="222" class="m">real starting points</text>
<g class="ts">
  <rect x="1318" y="240" width="200" height="42" class="chip"/>
  <text x="1328" y="258">13 templates</text>
  <text x="1328" y="273" class="m">editorial · product · immersive</text>

  <rect x="1318" y="290" width="200" height="42" class="chip"/>
  <text x="1328" y="308">Tokens</text>
  <text x="1328" y="323" class="m">DTCG · CSS · Tailwind</text>

  <rect x="1318" y="340" width="200" height="42" class="chip"/>
  <text x="1328" y="358">Snippets</text>
  <text x="1328" y="373" class="m">parallax · cursor · marquee</text>

  <rect x="1318" y="390" width="200" height="42" class="chip"/>
  <text x="1328" y="408">Media</text>
  <text x="1328" y="423" class="m">film loop · poster</text>

  <rect x="1318" y="440" width="200" height="42" class="chip"/>
  <text x="1328" y="458">Diagrams</text>
  <text x="1328" y="473" class="m">system · circuit · workflow</text>

  <rect x="1318" y="490" width="200" height="42" class="chip"/>
  <text x="1328" y="508">Figma samples</text>
  <text x="1328" y="523" class="m">variables · token export</text>
</g>
<text x="1318" y="566" class="m" fill="#6F6A63">licensed · attributed</text>

