<!-- bureau-ignore-file BS-W02 BS-W03 BS-T01 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">BUREAU architecture</title>
<desc id="desc">Host agents connect to the SKILL.md router, which loads references, scripts and assets on demand, writes project state, and feeds the review circuit back into the next pass.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#5A5A62"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#FF4A1C"/>
  </marker>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#17171B" stroke-width="1"/>
  </pattern>
  <style>
    .bg{fill:#0B0B0C}
    .title{font-family:Georgia,'Times New Roman',serif;font-size:42px;fill:#F1EDE6;letter-spacing:-1.2px}
    .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#8F8A81;letter-spacing:2.4px}
    .label{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#8F8A81;letter-spacing:1.6px}
    .t{font-family:Archivo,system-ui,sans-serif;font-size:14px;fill:#F1EDE6}
    .ts{font-family:Archivo,system-ui,sans-serif;font-size:12px;fill:#B8B2A8}
    .m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:#9A948B}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#D8D2C6}
    .accent{fill:#FF4A1C}
    .acid{fill:#D6FF3E}
    .blue{fill:#4D7CFE}
    .box{fill:#111114;stroke:#2A2A30;stroke-width:1}
    .boxA{fill:#131316;stroke:#FF4A1C;stroke-width:1}
    .chip{fill:#17171B;stroke:#2C2C33;stroke-width:1}
    .line{stroke:#3A3A42;stroke-width:1;fill:none}
    .dash{stroke:#4A4A52;stroke-width:1;fill:none;stroke-dasharray:3 5}
    .flow{stroke:#5A5A62;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
    .flowA{stroke:#FF4A1C;stroke-width:1.2;fill:none;marker-end:url(#arrowAccent)}
  </style>
</defs>

<rect class="bg" width="1600" height="1000"/>
<rect width="1600" height="1000" fill="url(#grid)" opacity=".55"/>
<rect x="64" y="54" width="8" height="8" class="accent"/>
<text x="86" y="64" class="sub">BUREAU / SYSTEM MAP · 01</text>
<text x="64" y="106" class="title">Architecture of an autonomous design bureau</text>
<text x="64" y="136" class="ts">One router. Twenty-three depth modules. Seven scripts. A project state that survives the session.</text>
<text x="1536" y="64" class="sub" text-anchor="end">v7.3.0 / MIT</text>
<text x="1536" y="86" class="m" text-anchor="end">progressive disclosure · no telemetry</text>

<!-- HOSTS -->
<rect x="64" y="176" width="260" height="424" class="box"/>
<text x="84" y="204" class="label">HOSTS / DISCOVERY</text>
<text x="84" y="222" class="m">same skill folder, four paths</text>

<g>
  <rect x="84" y="242" width="220" height="72" class="chip"/>
  <text x="96" y="266" class="t">Claude Code</text>
  <text x="96" y="284" class="m">~/.claude/skills/bureau</text>
  <text x="96" y="300" class="m">/bureau command</text>

  <rect x="84" y="326" width="220" height="72" class="chip"/>
  <text x="96" y="350" class="t">Codex</text>
  <text x="96" y="368" class="m">~/.codex/skills/bureau</text>
  <text x="96" y="384" class="m">AGENTS.md block</text>

  <rect x="84" y="410" width="220" height="72" class="chip"/>
  <text x="96" y="434" class="t">Antigravity</text>
  <text x="96" y="452" class="m">.agents/skills/bureau</text>
  <text x="96" y="468" class="m">model_decision rule</text>

  <rect x="84" y="494" width="220" height="72" class="chip"/>
  <text x="96" y="518" class="t">Hermes</text>
  <text x="96" y="536" class="m">~/.hermes/skills/creative</text>
  <text x="96" y="552" class="m">categorized skill</text>
</g>
<text x="84" y="586" class="m" fill="#6F6A63">one payload · four hosts · zero drift</text>

<!-- ROUTER -->
<rect x="430" y="176" width="340" height="424" class="boxA"/>
<rect x="430" y="176" width="6" height="424" class="accent"/>
<text x="456" y="204" class="label">SKILL.md / ROUTER</text>
<text x="456" y="236" class="t" style="font-size:22px">Read what decides</text>
<text x="456" y="258" class="t" style="font-size:22px">what to read.</text>
<text x="456" y="286" class="m">≈ 350 lines · not 3,000</text>

<g>
  <rect x="456" y="310" width="288" height="42" class="chip"/>
  <text x="468" y="328" class="mono">01</text><text x="492" y="328" class="ts">Doctrine + non-negotiables</text>
  <text x="492" y="343" class="m">concept before pixels · truth as material</text>

  <rect x="456" y="360" width="288" height="42" class="chip"/>
  <text x="468" y="378" class="mono">02</text><text x="492" y="378" class="ts">Autonomy contract</text>
  <text x="492" y="393" class="m">decide with defaults · max 3 questions</text>

  <rect x="456" y="410" width="288" height="42" class="chip"/>
  <text x="468" y="428" class="mono">03</text><text x="492" y="428" class="ts">Routing table</text>
  <text x="492" y="443" class="m">intent → command → reference</text>

  <rect x="456" y="460" width="288" height="42" class="chip"/>
  <text x="468" y="478" class="mono">04</text><text x="492" y="478" class="ts">Circuit + hard rules</text>
  <text x="492" y="493" class="m">ten gates · evidence or it did not happen</text>

  <rect x="456" y="510" width="288" height="42" class="chip"/>
  <text x="468" y="528" class="mono">05</text><text x="492" y="528" class="ts">Tool protocol</text>
  <text x="492" y="543" class="m">Figma · Playwright · media · degradation</text>
</g>

