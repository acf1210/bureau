<!-- bureau-ignore-file BS-W02 BS-W03 BS-T01 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">BUREAU anti-slop system</title>
<desc id="desc">Six common AI design tells feed a detector and a human review pass, which feed Gate 8 Truth; the fix returns to the source, and the slop budget is zero.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A5A62"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FF4A1C"/></marker>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17171B" stroke-width="1"/></pattern>
  <style>
    .bg{fill:#0B0B0C}
    .title{font-family:Georgia,'Times New Roman',serif;font-size:42px;fill:#F1EDE6;letter-spacing:-1.2px}
    .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#8F8A81;letter-spacing:2.4px}
    .label{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#8F8A81;letter-spacing:1.6px}
    .t{font-family:Archivo,system-ui,sans-serif;font-size:15px;fill:#F1EDE6}
    .ts{font-family:Archivo,system-ui,sans-serif;font-size:11.5px;fill:#B8B2A8}
    .m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#9A948B}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:#D8D2C6}
    .id{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:#FF4A1C;letter-spacing:.8px}
    .big{font-family:Georgia,'Times New Roman',serif;font-size:56px;fill:#D6FF3E}
    .box{fill:#111114;stroke:#2A2A30;stroke-width:1}
    .boxA{fill:#141316;stroke:#FF4A1C;stroke-width:1}
    .chip{fill:#17171B;stroke:#2C2C33;stroke-width:1}
    .line{stroke:#3A3A42;stroke-width:1;fill:none}
    .dash{stroke:#4A4A52;stroke-width:1;fill:none;stroke-dasharray:3 5}
    .flow{stroke:#5A5A62;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .flowA{stroke:#FF4A1C;stroke-width:1.2;fill:none;marker-end:url(#aa)}
    .acid{fill:#D6FF3E}
  </style>
</defs>

<rect class="bg" width="1600" height="900"/>
<rect width="1600" height="900" fill="url(#g)" opacity=".5"/>
<rect x="64" y="54" width="8" height="8" fill="#FF4A1C"/>
<text x="86" y="64" class="sub">BUREAU / ANTI-SLOP · 04</text>
<text x="64" y="106" class="title">The average is the enemy.</text>
<text x="64" y="136" class="ts">Slop is not "made by AI". It is the internet's average reproduced without a decision.</text>
<text x="1536" y="64" class="sub" text-anchor="end">SLOP BUDGET = 0</text>
<text x="1536" y="86" class="m" text-anchor="end">P0 blocks Gate 8</text>

<!-- tells -->
<text x="64" y="190" class="label">01 / THE TELLS</text>
<text x="64" y="208" class="m">mechanical subset · read in context</text>

<g>
  <rect x="64" y="228" width="348" height="120" class="chip"/>
  <text x="80" y="252" class="id">BS-K01</text>
  <text x="80" y="276" class="t">Purple gradient brand</text>
  <text x="80" y="298" class="ts">The 2023–2026 AI-startup default.</text>
  <text x="80" y="320" class="m">FIX: material + story, not hue.</text>

  <rect x="428" y="228" width="348" height="120" class="chip"/>
  <text x="444" y="252" class="id">BS-C01</text>
  <text x="444" y="276" class="t">Centered hero template</text>
  <text x="444" y="298" class="ts">Pill + H1 + gray subtitle + two buttons.</text>
  <text x="444" y="320" class="m">FIX: object, stage, split, index, proof.</text>

  <rect x="64" y="364" width="348" height="120" class="chip"/>
  <text x="80" y="388" class="id">BS-M01</text>
  <text x="80" y="412" class="t">Fade-up on everything</text>
  <text x="80" y="434" class="ts">Motion with no hierarchy or character.</text>
  <text x="80" y="456" class="m">FIX: one entrance, then quiet.</text>

  <rect x="428" y="364" width="348" height="120" class="chip"/>
  <text x="444" y="388" class="id">BS-W03</text>
  <text x="444" y="412" class="t">Unsourced credibility</text>
  <text x="444" y="434" class="ts">99.9% uptime. 10,000+ teams. No source.</text>
  <text x="444" y="456" class="m">FIX: source + date, or remove.</text>

  <rect x="64" y="500" width="348" height="120" class="chip"/>
  <text x="80" y="524" class="id">BS-I04</text>
  <text x="80" y="548" class="t">Fake product dashboard</text>
  <text x="80" y="570" class="ts">The same bar chart, no real interface.</text>
  <text x="80" y="592" class="m">FIX: build the real view or a diagram.</text>

  <rect x="428" y="500" width="348" height="120" class="chip"/>
  <text x="444" y="524" class="id">BS-T01</text>
  <text x="444" y="548" class="t">Default AI font pairing</text>
  <text x="444" y="570" class="ts">Space Grotesk + Inter as the identity.</text>
  <text x="444" y="592" class="m">FIX: display with its own voice.</text>
</g>

<path d="M776 288 C806 288 806 300 836 300" class="flow"/>
<path d="M776 424 C806 424 806 400 836 400" class="flow"/>
<path d="M776 560 C806 560 806 500 836 500" class="flow"/>

<!-- detector -->
<rect x="836" y="228" width="300" height="392" class="box"/>
<text x="856" y="256" class="label">02 / DETECTOR</text>
<text x="856" y="274" class="m">mechanical + human</text>

<rect x="856" y="292" width="260" height="86" class="chip"/>
<text x="870" y="316" class="mono" fill="#FF4A1C">audit.mjs</text>
<text x="870" y="336" class="ts">source → findings + score</text>
<text x="870" y="354" class="m">regex · structure · a11y basics</text>

<rect x="856" y="390" width="260" height="86" class="chip"/>
<text x="870" y="414" class="mono" fill="#FF4A1C">visual-audit.mjs</text>
<text x="870" y="434" class="ts">URL → screenshots + JSON</text>
<text x="870" y="452" class="m">contrast · overflow · motion · LCP</text>

<rect x="856" y="488" width="260" height="86" class="chip"/>
<text x="870" y="512" class="mono" fill="#D6FF3E">human review</text>
<text x="870" y="532" class="ts">composition · truth · taste</text>
<text x="870" y="550" class="m">the detector cannot judge this</text>

<path d="M1136 424 L1176 424" class="flow"/>

<!-- gate 8 -->
<rect x="1176" y="228" width="360" height="392" class="boxA"/>
<rect x="1176" y="228" width="5" height="392" fill="#FF4A1C"/>
<text x="1198" y="256" class="label">03 / GATE</text>
<text x="1198" y="294" class="big">G8</text>
<text x="1198" y="322" class="t" style="font-size:22px">Truth</text>
<text x="1198" y="344" class="m">EDITOR-IN-CHIEF · WEIGHT 8</text>
<line x1="1198" y1="360" x2="1512" y2="360" class="line"/>
<text x="1198" y="386" class="ts">Is every word true and free</text>
<text x="1198" y="404" class="ts">of AI tells?</text>
<text x="1198" y="434" class="m">PASS ≥ 3.5/5 · ZERO P0</text>
<text x="1198" y="456" class="m">any fabrication → fail</text>
<text x="1198" y="478" class="m">Tribunal may veto a passing score</text>
<text x="1198" y="512" class="mono" fill="#FF4A1C">audit.json</text>
<text x="1198" y="530" class="mono" fill="#FF4A1C">copy-review.md</text>
<text x="1198" y="548" class="mono" fill="#FF4A1C">source list</text>
<text x="1198" y="580" class="m" fill="#6F6A63">evidence or it did not happen</text>

<!-- feedback -->
<path d="M1356 620 L1356 676 L238 676 L238 620" class="flowA"/>
<text x="800" y="666" class="m" fill="#FF4A1C" text-anchor="middle">fix at the source · never in the screenshot</text>

<!-- bottom -->
<rect x="64" y="704" width="1472" height="120" class="box"/>
<text x="84" y="732" class="label">04 / THE CURE</text>
<text x="84" y="762" class="t" style="font-size:20px">Specificity, not more design.</text>
<text x="84" y="786" class="ts">Subject × Tension × Form → one idea, one signature move, one proof.</text>
<text x="84" y="806" class="m">if the answer is "the logo", the page is generic.</text>

<g>
  <rect x="880" y="728" width="186" height="76" class="chip"/>
  <text x="896" y="752" class="mono">SUBJECT</text>
  <text x="896" y="772" class="m">what is literally here</text>
  <text x="896" y="790" class="m">not the category</text>

  <rect x="1076" y="728" width="186" height="76" class="chip"/>
  <text x="1092" y="752" class="mono">TENSION</text>
  <text x="1092" y="772" class="m">what the brand resolves</text>
  <text x="1092" y="790" class="m">speed vs care, scale vs intimacy</text>

  <rect x="1272" y="728" width="244" height="76" class="chip"/>
  <text x="1288" y="752" class="mono">FORM</text>
  <text x="1288" y="772" class="m">material, type, motion, data</text>
  <text x="1288" y="790" class="m">the behavior that makes it visible</text>
</g>

<!-- slider / budget -->
<rect x="64" y="846" width="1472" height="10" fill="#202026"/>
<rect x="64" y="846" width="220" height="10" fill="#FF4A1C"/>
<text x="64" y="880" class="m">0 P0 · 0 fake proof · 0 lorem ipsum · 0 default gradient</text>
<text x="1536" y="880" class="m" text-anchor="end">BUREAU / antislop.svg · 1600×900</text>
</svg>
