<!-- bureau-ignore-file BS-W02 BS-W03 BS-T01 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">The BUREAU review circuit</title>
<desc id="desc">Gate Zero plus nine weighted gates flow in a snake from intake to launch, then to a Tribunal with veto power and a verdict ladder from Award Track to Fail.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5A5A62"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FF4A1C"/></marker>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17171B" stroke-width="1"/></pattern>
  <style>
    .bg{fill:#0B0B0C}
    .title{font-family:Georgia,'Times New Roman',serif;font-size:42px;fill:#F1EDE6;letter-spacing:-1.2px}
    .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#8F8A81;letter-spacing:2.4px}
    .label{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#8F8A81;letter-spacing:1.6px}
    .t{font-family:Archivo,system-ui,sans-serif;font-size:17px;fill:#F1EDE6}
    .ts{font-family:Archivo,system-ui,sans-serif;font-size:12.5px;fill:#B8B2A8}
    .m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:#9A948B}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#D8D2C6}
    .gid{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#FF4A1C;letter-spacing:1px}
    .w{font-family:Georgia,'Times New Roman',serif;font-size:34px;fill:#D6FF3E}
    .box{fill:#111114;stroke:#2A2A30;stroke-width:1}
    .boxA{fill:#141316;stroke:#FF4A1C;stroke-width:1}
    .chip{fill:#17171B;stroke:#2C2C33;stroke-width:1}
    .line{stroke:#3A3A42;stroke-width:1;fill:none}
    .dash{stroke:#4A4A52;stroke-width:1;fill:none;stroke-dasharray:3 5}
    .flow{stroke:#5A5A62;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .flowA{stroke:#FF4A1C;stroke-width:1.2;fill:none;marker-end:url(#aa)}
    .bar{fill:#26262C}
    .barA{fill:#D6FF3E}
    .barV{fill:#FF4A1C}
  </style>
</defs>

<rect class="bg" width="1600" height="1100"/>
<rect width="1600" height="1100" fill="url(#g)" opacity=".5"/>
<rect x="64" y="54" width="8" height="8" fill="#D6FF3E"/>
<text x="86" y="64" class="sub">BUREAU / REVIEW CIRCUIT · 02</text>
<text x="64" y="106" class="title">Gate Zero + nine gates, then a Tribunal.</text>
<text x="64" y="136" class="ts">Weights sum to 100. Any hard failure vetoes the release, regardless of the average.</text>
<text x="1536" y="64" class="sub" text-anchor="end">EVIDENCE OVER OPINION</text>
<text x="1536" y="86" class="m" text-anchor="end">score 0–5 · 0.5 steps</text>

<!-- G0 -->
<g>
  <rect x="90" y="180" width="420" height="150" class="boxA"/>
  <rect x="90" y="180" width="5" height="150" fill="#FF4A1C"/>
  <text x="112" y="208" class="gid">G0 / INTAKE</text>
  <text x="112" y="238" class="t" style="font-size:22px">The Producer</text>
  <text x="112" y="264" class="ts">Is the brief true, bounded,</text>
  <text x="112" y="282" class="ts">and evidenced?</text>
  <text x="112" y="310" class="m">BUREAU.md · config.json</text>
  <text x="490" y="208" class="m" text-anchor="end">WEIGHT</text>
  <text x="490" y="244" class="w" text-anchor="end">5</text>
</g>

<!-- G1 -->
<g>
  <rect x="550" y="180" width="420" height="150" class="box"/>
  <text x="572" y="208" class="gid">G1 / CONCEPT</text>
  <text x="572" y="238" class="t" style="font-size:22px">The Creative Director</text>
  <text x="572" y="264" class="ts">Is there an idea only this</text>
  <text x="572" y="282" class="ts">brand could own?</text>
  <text x="572" y="310" class="m">3 comps · decision.md</text>
  <text x="950" y="208" class="m" text-anchor="end">WEIGHT</text>
  <text x="950" y="244" class="w" text-anchor="end">14</text>
</g>

<!-- G2 -->
<g>
  <rect x="90" y="350" width="420" height="150" class="box"/>
  <text x="112" y="378" class="gid">G2 / DIRECTION</text>
  <text x="112" y="408" class="t" style="font-size:22px">The Art Director</text>
  <text x="112" y="434" class="ts">Does the world feel inevitable</text>
  <text x="112" y="452" class="ts">and alive?</text>
  <text x="112" y="480" class="m">DESIGN.md · type · color</text>
  <text x="490" y="378" class="m" text-anchor="end">WEIGHT</text>
  <text x="490" y="414" class="w" text-anchor="end">15</text>
</g>

<!-- G3 -->
<g>
  <rect x="550" y="350" width="420" height="150" class="box"/>
  <text x="572" y="378" class="gid">G3 / TYPE &amp; COLOR</text>
  <text x="572" y="408" class="t" style="font-size:22px">The Type Director</text>
  <text x="572" y="434" class="ts">Is the type distinctive and</text>
  <text x="572" y="452" class="ts">the color narrative coherent?</text>
  <text x="572" y="480" class="m">tokens · contrast · specimen</text>
  <text x="950" y="378" class="m" text-anchor="end">WEIGHT</text>
  <text x="950" y="414" class="w" text-anchor="end">12</text>
</g>

<!-- G4 -->
<g>
  <rect x="90" y="520" width="420" height="150" class="box"/>
  <text x="112" y="548" class="gid">G4 / COMPOSITION</text>
  <text x="112" y="578" class="t" style="font-size:22px">The Layout Architect</text>
  <text x="112" y="604" class="ts">Does composition direct</text>
  <text x="112" y="622" class="ts">attention at every viewport?</text>
  <text x="112" y="650" class="m">4 viewports · full page</text>
  <text x="490" y="548" class="m" text-anchor="end">WEIGHT</text>
  <text x="490" y="584" class="w" text-anchor="end">12</text>
</g>

<!-- G5 -->
<g>
  <rect x="550" y="520" width="420" height="150" class="box"/>
  <text x="572" y="548" class="gid">G5 / MOTION</text>
  <text x="572" y="578" class="t" style="font-size:22px">The Motion Director</text>
  <text x="572" y="604" class="ts">Is motion choreographed,</text>
  <text x="572" y="622" class="ts">useful, and performant?</text>
  <text x="572" y="650" class="m">MOTION.md · reduced shot</text>
  <text x="950" y="548" class="m" text-anchor="end">WEIGHT</text>
  <text x="950" y="584" class="w" text-anchor="end">12</text>
</g>

<!-- G6 -->
<g>
  <rect x="90" y="690" width="420" height="150" class="box"/>
  <text x="112" y="718" class="gid">G6 / ENGINEERING</text>
  <text x="112" y="748" class="t" style="font-size:22px">The Tech Lead</text>
  <text x="112" y="774" class="ts">Is it fast, resilient,</text>
  <text x="112" y="792" class="ts">and maintainable?</text>
  <text x="112" y="820" class="m">report.json · console · budget</text>
  <text x="490" y="718" class="m" text-anchor="end">WEIGHT</text>
  <text x="490" y="754" class="w" text-anchor="end">10</text>
</g>

<!-- G7 -->
<g>
  <rect x="550" y="690" width="420" height="150" class="box"/>
  <text x="572" y="718" class="gid">G7 / ACCESS</text>
  <text x="572" y="748" class="t" style="font-size:22px">The Access Lead</text>
  <text x="572" y="774" class="ts">Can everyone use it, including</text>
  <text x="572" y="792" class="ts">keyboard and reduced motion?</text>
  <text x="572" y="820" class="m">keyboard notes · axe · zoom</text>
  <text x="950" y="718" class="m" text-anchor="end">WEIGHT</text>
  <text x="950" y="754" class="w" text-anchor="end">9</text>
</g>

<!-- G8 -->
<g>
  <rect x="90" y="860" width="420" height="150" class="box"/>
  <text x="112" y="888" class="gid">G8 / TRUTH</text>
  <text x="112" y="918" class="t" style="font-size:22px">The Editor-in-Chief</text>
  <text x="112" y="944" class="ts">Is every word true and free</text>
  <text x="112" y="962" class="ts">of AI tells?</text>
  <text x="112" y="990" class="m">audit.json · copy review</text>
  <text x="490" y="888" class="m" text-anchor="end">WEIGHT</text>
  <text x="490" y="924" class="w" text-anchor="end">8</text>
</g>

<!-- G9 -->
<g>
  <rect x="550" y="860" width="420" height="150" class="box"/>
  <text x="572" y="888" class="gid">G9 / LAUNCH</text>
  <text x="572" y="918" class="t" style="font-size:22px">The Release Engineer</text>
  <text x="572" y="944" class="ts">Can it ship, be found,</text>
  <text x="572" y="962" class="ts">measured, and recovered?</text>
  <text x="572" y="990" class="m">launch checklist · OG · rollback</text>
  <text x="950" y="888" class="m" text-anchor="end">WEIGHT</text>
  <text x="950" y="924" class="w" text-anchor="end">3</text>
</g>

<!-- flow arrows -->
<path d="M510 255 L550 255" class="flow"/>
<path d="M760 330 L760 350" class="flow"/>
