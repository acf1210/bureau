<path d="M510 595 L550 595" class="flow"/>
<path d="M760 670 L760 690" class="flow"/>
<path d="M550 765 L510 765" class="flow"/>
<path d="M300 840 L300 860" class="flow"/>
<path d="M510 935 L550 935" class="flow"/>
<path d="M970 935 C1010 935 1010 700 1040 660" class="flowA"/>

<!-- SIDEBAR -->
<rect x="1030" y="180" width="480" height="320" class="box"/>
<text x="1050" y="208" class="label">WEIGHT DISTRIBUTION / 100</text>
<text x="1050" y="228" class="m">the score is a budget of attention</text>

<g>
  <text x="1050" y="256" class="m">G0 Intake</text>
  <rect x="1140" y="248" width="300" height="4" class="bar"/><rect x="1140" y="248" width="15" height="4" class="barA"/>
  <text x="1488" y="256" class="mono" text-anchor="end">5</text>

  <text x="1050" y="280" class="m">G1 Concept</text>
  <rect x="1140" y="272" width="300" height="4" class="bar"/><rect x="1140" y="272" width="42" height="4" class="barA"/>
  <text x="1488" y="280" class="mono" text-anchor="end">14</text>

  <text x="1050" y="304" class="m">G2 Direction</text>
  <rect x="1140" y="296" width="300" height="4" class="bar"/><rect x="1140" y="296" width="45" height="4" class="barA"/>
  <text x="1488" y="304" class="mono" text-anchor="end">15</text>

  <text x="1050" y="328" class="m">G3 Type &amp; Color</text>
  <rect x="1140" y="320" width="300" height="4" class="bar"/><rect x="1140" y="320" width="36" height="4" class="barA"/>
  <text x="1488" y="328" class="mono" text-anchor="end">12</text>

  <text x="1050" y="352" class="m">G4 Composition</text>
  <rect x="1140" y="344" width="300" height="4" class="bar"/><rect x="1140" y="344" width="36" height="4" class="barA"/>
  <text x="1488" y="352" class="mono" text-anchor="end">12</text>

  <text x="1050" y="376" class="m">G5 Motion</text>
  <rect x="1140" y="368" width="300" height="4" class="bar"/><rect x="1140" y="368" width="36" height="4" class="barA"/>
  <text x="1488" y="376" class="mono" text-anchor="end">12</text>

  <text x="1050" y="400" class="m">G6 Engineering</text>
  <rect x="1140" y="392" width="300" height="4" class="bar"/><rect x="1140" y="392" width="30" height="4" class="barA"/>
  <text x="1488" y="400" class="mono" text-anchor="end">10</text>

  <text x="1050" y="424" class="m">G7 Access</text>
  <rect x="1140" y="416" width="300" height="4" class="bar"/><rect x="1140" y="416" width="27" height="4" class="barA"/>
  <text x="1488" y="424" class="mono" text-anchor="end">9</text>

  <text x="1050" y="448" class="m">G8 Truth</text>
  <rect x="1140" y="440" width="300" height="4" class="bar"/><rect x="1140" y="440" width="24" height="4" class="barA"/>
  <text x="1488" y="448" class="mono" text-anchor="end">8</text>

  <text x="1050" y="472" class="m">G9 Launch</text>
  <rect x="1140" y="464" width="300" height="4" class="bar"/><rect x="1140" y="464" width="9" height="4" class="barA"/>
  <text x="1488" y="472" class="mono" text-anchor="end">3</text>
</g>
<text x="1050" y="492" class="m" fill="#6F6A63">points = (score ÷ 5) × weight</text>

<!-- TRIBUNAL -->
<rect x="1030" y="520" width="480" height="190" class="boxA"/>
<rect x="1030" y="520" width="5" height="190" fill="#FF4A1C"/>
<text x="1052" y="548" class="label">FINAL NODE / VETO POWER</text>
<text x="1052" y="580" class="t" style="font-size:24px">The Tribunal</text>
<text x="1052" y="602" class="gid" style="color:#9A948B">THE PARTNER</text>
<text x="1052" y="626" class="ts">Reads every gate, the evidence,</text>
<text x="1052" y="644" class="ts">and the original brief.</text>
<text x="1052" y="668" class="m">Does the work keep the promise?</text>
<text x="1052" y="684" class="m">Would we sign it in public?</text>
<text x="1488" y="548" class="m" text-anchor="end">NO RE-SCORE</text>

<!-- VERDICTS -->
<rect x="1030" y="730" width="480" height="280" class="box"/>
<text x="1050" y="758" class="label">VERDICT LADDER</text>
<g>
  <circle cx="1058" cy="786" r="4" fill="#D6FF3E"/>
  <text x="1074" y="790" class="ts">Award Track</text>
  <text x="1488" y="790" class="mono" text-anchor="end">≥ 90</text>
  <line x1="1050" y1="802" x2="1490" y2="802" class="line"/>

  <circle cx="1058" cy="824" r="4" fill="#F1EDE6"/>
  <text x="1074" y="828" class="ts">Pass</text>
  <text x="1488" y="828" class="mono" text-anchor="end">82–89</text>
  <line x1="1050" y1="840" x2="1490" y2="840" class="line"/>

  <circle cx="1058" cy="862" r="4" fill="#E0B94A"/>
  <text x="1074" y="866" class="ts">Conditional</text>
  <text x="1488" y="866" class="mono" text-anchor="end">72–81</text>
  <line x1="1050" y1="878" x2="1490" y2="878" class="line"/>

  <circle cx="1058" cy="900" r="4" fill="#FF4A1C"/>
  <text x="1074" y="904" class="ts">Fail</text>
  <text x="1488" y="904" class="mono" text-anchor="end">&lt; 72</text>
</g>
<text x="1050" y="934" class="m" fill="#FF4A1C">HARD FAILS:</text>
<text x="1050" y="950" class="m">any gate &lt; 3.5/5 · any P0 · evidence missing</text>
<text x="1050" y="966" class="m">stale source hash · Tribunal veto</text>
<text x="1050" y="988" class="m" fill="#6F6A63">a 95 average with one P0 is still a Fail.</text>

<!-- legend -->
<g>
  <text x="64" y="1056" class="label">LEGEND</text>
  <line x1="64" y1="1072" x2="104" y2="1072" class="flow"/>
  <text x="114" y="1076" class="m">gate flow</text>
  <line x1="214" y1="1072" x2="254" y2="1072" class="flowA"/>
  <text x="264" y="1076" class="m">tribunal / veto</text>
  <rect x="400" y="1065" width="10" height="10" class="boxA"/>
  <text x="418" y="1076" class="m">gate boundary</text>
</g>
<text x="1536" y="1076" class="m" text-anchor="end">BUREAU / circuit.svg · 1600×1100</text>
</svg>
