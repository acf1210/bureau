name: source availability

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source availability
        run: node skill/scripts/source-monitor.mjs --out source-report.json
      - name: Save timestamped report
        uses: actions/upload-artifact@v4
        with:
          name: source-report-${{ github.run_id }}
          path: source-report.json
          retention-days: 30
